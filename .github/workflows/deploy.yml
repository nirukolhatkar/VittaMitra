
name: Deploy VittaMitra ZIP to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'vittamitra.zip'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:

  build:
    name: Extract and Upload VittaMitra
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract VittaMitra ZIP
        run: |
          python3 - <<'PY'
          import zipfile
          import pathlib
          import shutil

          archive = pathlib.Path("vittamitra.zip")
          output = pathlib.Path("_site")

          if not archive.exists():
              raise SystemExit("vittamitra.zip not found")

          output.mkdir()

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  target = (output / item.filename).resolve()
                  if not target.is_relative_to(output.resolve()):
                      raise SystemExit("Unsafe ZIP path detected")
              z.extractall(output)

          if not (output / "index.html").exists():
              folders = [
                  p for p in output.iterdir()
                  if p.is_dir() and (p / "index.html").exists()
              ]

              if len(folders) == 1:
                  temp = output.parent / "_site_temp"
                  folders[0].rename(temp)
                  shutil.rmtree(output)
                  temp.rename(output)

          if not (output / "index.html").exists():
              raise SystemExit("index.html not found")

          print("VittaMitra extracted successfully")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write
      contents: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        
